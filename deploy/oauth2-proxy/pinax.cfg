# /etc/oauth2-proxy/pinax.cfg: oauth2-proxy in front of Pinax, signing people in with your identity provider
# (OpenID Connect; Microsoft Entra ID shown). Option names are oauth2-proxy 7's; see docs/DEPLOYMENT.md.

# Where browsers connect. Terminate TLS here (https_address, tls_cert_file, tls_key_file) or in a load balancer
# in front; with a load balancer, set reverse_proxy = true so oauth2-proxy uses its X-Forwarded-* headers.
http_address = "0.0.0.0:4180"
reverse_proxy = false

# Pinax, listening on this host only. Pinax stops a request after PINAX_QUERY_TIMEOUT (180 seconds by default) and
# says why; wait longer than that (oauth2-proxy's own default is 30 seconds), so a long search of a whole filesystem
# ends with Pinax's explanation rather than a gateway error.
upstreams = ["http://127.0.0.1:8001/"]
upstream_timeout = "5m"

provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/YOUR-TENANT-ID/v2.0"
client_id = "YOUR-APPLICATION-CLIENT-ID"
client_secret_file = "/etc/oauth2-proxy/client-secret"
scope = "openid email profile"
email_domains = ["example.org"]
skip_provider_button = true

# The session cookie. Its secret is OAUTH2_PROXY_COOKIE_SECRET in /etc/oauth2-proxy/pinax.env.
cookie_name = "_pinax"
cookie_secure = true
cookie_samesite = "lax"

# Pass the signed-in person to Pinax: PINAX_AUTH_HEADER names which header Pinax reads
# (X-Forwarded-Preferred-Username by default in deploy/pinax.env). Headers a client sends itself are removed.
pass_user_headers = true
skip_auth_strip_headers = true

# Health checks need no sign-in; they report only states and counts.
skip_auth_routes = ["GET=^/api/health$"]
