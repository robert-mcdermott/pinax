  <rect x="36" y="45" width="7" height="7" rx="2" fill="#AA4AC4"/>
  <rect x="46" y="45" width="6" height="7" rx="2" fill="#0A799A" stroke="#FFFFFF" stroke-width="1.2"/>
</svg>
